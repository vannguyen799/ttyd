# Throwaway: does `on: push: tags` fire in this repository?
# The pattern deliberately does NOT overlap release.yml's "v*.*.*", so probing
# cannot kick off a real 16-job release build.
name: trigger-probe

on:
  push:
    tags: ["probe-*"]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "tag trigger works, ref=$GITHUB_REF sha=$GITHUB_SHA"
