name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    uses: ./.github/workflows/backend.yml
  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check version bump
        run: |
          TAG=${RELEASE_TAG#v}
          VERSION=$(sed -nE 's/.*project\(ttyd VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "$TAG" != "$VERSION" ]; then
            echo "=== Version in CMakeLists.txt and git tag does not match!"
            echo "=== Git Tag: $TAG, Version: $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir release
          for arch in i686 x86_64 arm armhf aarch64 mips mipsel mips64 mips64el ppc64 ppc64le s390x; do
            cp "artifacts/ttyd.${arch}/ttyd" "release/ttyd-pro-linux-${arch}"
          done
          cp artifacts/ttyd.macos-x86_64/ttyd release/ttyd-pro-macos-x86_64
          cp artifacts/ttyd.macos-aarch64/ttyd release/ttyd-pro-macos-aarch64
          cp artifacts/ttyd.msvc/ttyd.exe release/ttyd-pro-windows-x86_64.exe
          cp install.sh install.ps1 release/
          # The session wrapper ships as a release asset, not fetched from the
          # default branch: the installer verifies it against SHA256SUMS, and a
          # pinned --version must get the wrapper that release was tested with.
          cp deploy/scripts/ttyd-session.sh release/
          chmod 0755 release/ttyd-pro-* release/install.sh release/ttyd-session.sh
          cd release
          sha256sum ttyd-pro-* install.sh install.ps1 ttyd-session.sh > SHA256SUMS
      - uses: ncipollo/release-action@v1
        with:
          artifacts: release/*
          tag: ${{ env.RELEASE_TAG }}
          allowUpdates: true
          draft: false
          generateReleaseNotes: true
          makeLatest: true
