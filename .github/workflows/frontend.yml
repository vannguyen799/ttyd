name: frontend

on:
  push:
    paths:
    - ".github/workflows/frontend.yml"
    - "html/**"
  pull_request:
    paths:
    - ".github/workflows/frontend.yml"
    - "html/**"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: html/pnpm-lock.yaml
      - name: Run pnpm install, check and build
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
        working-directory: html
