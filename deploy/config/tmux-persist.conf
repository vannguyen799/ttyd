# ══════════════════════════════════════════════════════════════
# tmux session persistence — resurrect + continuum
# ══════════════════════════════════════════════════════════════
# Sourced from ~/.tmux.conf (wired up idempotently by start-ttyd.sh).
# Plugins are provided by Nix, not TPM — see dev.nix:
#   pkgs.tmuxPlugins.resurrect
#   pkgs.tmuxPlugins.continuum
#
# What persists:  window/pane layout, working dirs, scrollback at save
#                 time, and re-launch of whitelisted programs.
# What does NOT:  live in-memory state. Agents (claude/codex) are
#                 re-launched fresh — their conversation is not restored.
# ══════════════════════════════════════════════════════════════

# ── resurrect ────────────────────────────────────────────────
# Capture pane scrollback so restored panes aren't blank.
set -g @resurrect-capture-pane-contents 'on'
# Programs to re-launch on restore. '~name' matches a command that may
# carry arguments. Keep this conservative to avoid surprising relaunches.
set -g @resurrect-processes '"~claude" "~codex" ssh psql "~node" "~python3" htop'

# ── continuum ────────────────────────────────────────────────
# Auto-save every 15 minutes; auto-restore when the tmux server starts
# (start-ttyd.sh kicks the server on boot so this happens before any
# browser connects).
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# ── mouse: on (click-to-switch panes) ────────────────────────
# Single click selects the pane under it (tmux default MouseDown1Pane =
# `select-pane -t = ; send -M`), so clicking another pane switches focus even
# while a mouse-grabbing TUI (Claude/vim/htop, `#{mouse_any_flag}`) runs in it.
set -g mouse on

# The catch: those TUIs request the mouse, so tmux's DEFAULT MouseDrag1Pane
# forwards a drag to the app (`send -M`) instead of selecting — a drag over
# Claude selects nothing and copies nothing. Override it to ALWAYS enter
# copy-mode on drag, so dragging selects tmux cells everywhere (shell AND
# inside Claude). Border-drag resize (MouseDrag1Border) is untouched.
bind-key -T root MouseDrag1Pane copy-mode -M

# The wheel was the one gesture that did NOT select the pane it acted on, and
# tmux is inconsistent with itself about it: the copy-mode table's own default
# is `select-pane ; send -X scroll-up`, while the root table (the FIRST notch,
# the one that enters copy-mode) just scrolls the pane under the pointer and
# leaves the active pane alone. That strands the user: `WheelDownPane` has no
# root binding at all, so it only resolves through the copy-mode table — which
# applies to the ACTIVE pane. Scroll an inactive pane up and there is no way to
# scroll it back down without clicking it first, and meanwhile every key, and
# the vkbd's own scroll/copy keys, still go to the other pane.
#
# Selecting first makes the wheel behave like every other mouse gesture here
# (MouseDown1Pane, Double/TripleClick1Pane, MouseDrag1Pane all select) and hands
# the second notch to the copy-mode table, where scrolling down works again.
# The rest of the binding is tmux's own default, kept verbatim: forward to the
# app when it grabs the mouse or is already in a mode, else enter copy-mode.
# `-e` so scrolling back to the bottom leaves copy-mode by itself.
#
# Safe for the vkbd/touch scroll keys: those synthesize a wheel aimed at the
# cursor cell (xterm/index.ts `wheelPoint`), which is always inside the ACTIVE
# pane — so `select-pane` there re-selects the pane that is already active.
bind-key -T root WheelUpPane select-pane \; \
    if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e'

# ── clipboard: browser-copy via OSC 52 ───────────────────────
# `set-clipboard on` is what carries a copy to the browser: whenever a copy
# command sets the tmux buffer, tmux emits OSC 52 to the client INLINE, in the
# same output frame — synchronous and correctly ordered. The earlier approach
# (copy-pipe to a `tmux load-buffer -w -` subshell) was async and landed the
# clipboard one selection behind; the native path fixes that. `Ms` is forced
# since tmux-256color omits the clipboard capability by default (without it,
# tmux has no escape sequence to send).
set -g set-clipboard on
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
# On drag-release, copy the selection (→ buffer → OSC 52 via set-clipboard) and
# leave copy-mode. So a plain drag auto-copies (no Cmd/Ctrl+C needed), uniformly
# at a shell and inside Claude. Double/triple click copy the word/line the same
# way (the default forwards these to the app when mouse_any_flag, so they're
# overridden too). Bound in BOTH copy tables (emacs + vi mode-keys).
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T root DoubleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-word \; run-shell -d 0.15 \; send-keys -X copy-selection-and-cancel
bind-key -T root TripleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-line \; run-shell -d 0.15 \; send-keys -X copy-selection-and-cancel
# Shift+drag on Win/Linux or ⌥+drag on macOS still makes a real xterm DOM
# selection (bypasses tmux mouse reporting) for a plain Cmd/Ctrl+C, as a
# zero-latency fallback when the server-side selection feels laggy.
# prefix + C-y: push the current tmux buffer to the browser clipboard. Runs
# as a tmux key binding (not shell input) so it works inside TUI apps like
# Claude/vim, unlike typing a `printf '\e]52…'` command at a shell prompt.
bind-key C-y run-shell -b 'tmux show-buffer 2>/dev/null | tmux load-buffer -w -'

# C-e (no prefix): from tmux scrollback/copy-mode, jump back to the live
# bottom (the vkbd "⏷ Last" button sends C-e). Bound in BOTH copy tables
# since the active one depends on mode-keys (emacs vs vi). It must be
# prefix-less: "Last" is pressed while in copy-mode, where the prefix key
# (C-b) is page-up, not a prefix. Outside copy-mode C-e is left untouched
# and passes through to the shell as its usual end-of-line.
bind-key -T copy-mode    C-e send-keys -X cancel
bind-key -T copy-mode-vi C-e send-keys -X cancel

# ── scrollback that survives a mouse-grabbing TUI ─────────────
# The bindings above are only reachable once the pane is ALREADY in copy-mode,
# and the usual way in — the wheel — stops working exactly where it is needed
# most. When the foreground app turns on mouse reporting (Claude Code, vim,
# htop; `#{mouse_any_flag}` = 1), tmux forwards wheel escapes straight to the
# app instead of entering copy-mode. The pane then never enters copy-mode, so
# nothing scrolls, `C-e` reaches the app as a plain end-of-line, and no
# selection can be made — which also leaves `buf→clip` above with an empty
# buffer. Verified: with mouse_any_flag=1, wheel-up leaves pane_in_mode=0.
#
# The prefix table is the way out: tmux claims the prefix before the pane does,
# whatever the app has enabled. These four are what the vkbd scroll/copy keys
# drive, so they work identically at a bare shell and inside Claude Code.
#
# `copy-mode -e` makes the pane leave copy-mode by itself once it is scrolled
# back to the bottom, so scrolling down never strands the user in it.
bind-key C-p if-shell -F '#{pane_in_mode}' \
    'send-keys -X -N 3 scroll-up' \
    'copy-mode -e ; send-keys -X -N 3 scroll-up'
bind-key C-n if-shell -F '#{pane_in_mode}' \
    'send-keys -X -N 3 scroll-down' \
    'copy-mode -e ; send-keys -X -N 3 scroll-down'
# Jump to the live bottom. No-op outside copy-mode, so the vkbd "⏷ Last"
# button is safe to press at any time — unlike the bare C-e it used to send,
# which a TUI would have swallowed as end-of-line.
bind-key C-e if-shell -F '#{pane_in_mode}' 'send-keys -X cancel'
# Copy the recent output wholesale, without selecting anything. Selecting text
# by hand is painful on a phone, and this is the common case anyway ("give me
# what just printed"). -S -200 takes the visible screen plus 200 lines of
# scrollback; -J rejoins lines tmux wrapped so pasted commands stay runnable.
bind-key C-w run-shell -b 'tmux capture-pane -p -J -S -200 | tmux load-buffer -w -'

# ── load plugins from the Nix profile ────────────────────────
# Guarded: if the plugins aren't installed yet (e.g. dev.nix not rebuilt),
# these are no-ops instead of config-load errors. continuum MUST load last.
if-shell '[ -e "$HOME/.nix-profile/share/tmux-plugins/resurrect/resurrect.tmux" ]' \
  'run-shell "$HOME/.nix-profile/share/tmux-plugins/resurrect/resurrect.tmux"'
if-shell '[ -e "$HOME/.nix-profile/share/tmux-plugins/continuum/continuum.tmux" ]' \
  'run-shell "$HOME/.nix-profile/share/tmux-plugins/continuum/continuum.tmux"'
